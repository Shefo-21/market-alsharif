<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الشريف - المتجر الإلكتروني</title>
    <style>
        /* تصميم الموقع الأساسي */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        .product-image {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .category {
            color: #7f8c8d;
            font-size: 14px;
            margin: 5px 0;
        }
        .product-name {
            font-size: 18px;
            color: #333;
            margin: 0 0 15px;
        }
        .price-section {
            margin-bottom: 15px;
        }
        .new-price {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
        }
        .old-price {
            color: #95a5a6;
            font-size: 14px;
            margin-right: 10px;
        }
        .add-to-cart-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .add-to-cart-btn:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #34495e;
            color: white;
            margin-top: 50px;
        }
        .loading-msg {
            text-align: center; 
            width: 100%; 
            color: #7f8c8d;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>مكتبة الشريف</h1>
        <p>أفضل الأدوات المدرسية والمكتبية بأفضل الأسعار</p>
    </header>

    <div class="container">
        <div id="products-container" class="products-grid">
            <h3 class="loading-msg">جاري تحميل المنتجات من السيرفر...</h3>
        </div>
    </div>

    <footer>
        <p>للتواصل وطلبات الجملة: 01019267002</p>
        <p>مكتبة الشريف © 2026</p>
    </footer>

    <script>
        // الرابط الجديد بعد رفع السيرفر على الإنترنت بنجاح
        const apiUrl = 'http://maktabatelsharif-api.somee.com/api/Products';

        async function fetchAndDisplayProducts() {
            const productsContainer = document.getElementById('products-container');
            if (!productsContainer) return;

            try {
                const response = await fetch(apiUrl);
                const products = await response.json();

                productsContainer.innerHTML = '';

                if (products.length === 0) {
                    productsContainer.innerHTML = '<h3 class="loading-msg">لا توجد منتجات متاحة حالياً.</h3>';
                    return;
                }

                products.forEach(product => {
                    if (product.isActive) {
                        const productCard = `
                            <div class="product-card">
                                ${product.badge ? `<span class="badge">${product.badge}</span>` : ''}
                                <img src="${product.imageUrl || 'https://via.placeholder.com/250x200?text=بدون+صورة'}" alt="${product.name}" class="product-image">
                                <div class="product-info">
                                    <p class="category">${product.category}</p>
                                    <h3 class="product-name">${product.name}</h3>
                                    <div class="price-section">
                                        <span class="new-price">${product.price} جنيه</span>
                                        ${product.oldPrice > 0 ? `<span class="old-price"><del>${product.oldPrice} جنيه</del></span>` : ''}
                                    </div>
                                    <button class="add-to-cart-btn" onclick="addToCart(${product.id}, '${product.name}')">
                                        أضف إلى السلة
                                    </button>
                                </div>
                            </div>
                        `;
                        productsContainer.innerHTML += productCard;
                    }
                });
            } catch (error) {
                console.error('الربط فشل:', error);
                productsContainer.innerHTML = '<h3 class="loading-msg" style="color: #e74c3c;">عذراً، حدث خطأ أثناء تحميل المنتجات. يرجى المحاولة لاحقاً.</h3>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAndDisplayProducts);

        function addToCart(id, name) {
            alert(`تم إضافة "${name}" إلى سلة المشتريات بنجاح!`);
        }
    </script>
</body>
</html>
